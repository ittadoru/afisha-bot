name: Optional G6 checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-g6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-subset:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare secret-free test configuration
        run: |
          cp .env.example .env
          test -f deploy/image-digests.env
          cat deploy/image-digests.env >> .env

      - name: Verify Compose configuration
        run: docker compose config --quiet

      - name: Start test data services and migrate
        run: |
          docker compose up --detach --wait postgres redis
          docker compose run --rm migrate

      - name: Run locked static, test and security subset
        run: docker compose --profile verify run --rm checks

      - name: Verify staging-only Nginx boundary
        run: |
          docker compose up --detach --wait api worker beat nginx
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/metrics)" = "404"

      - name: Stop services
        if: always()
        run: docker compose down --volumes

# ADR-021: this workflow has no secrets or deployment authority. Only the
# versioned clean-VPS gate for the exact commit is authoritative.
