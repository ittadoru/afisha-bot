[project]
name = "afishabot"
version = "0.1.0"
description = "Backend skeleton for the Afisha social events map"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "aiogram[proxy]>=3.30.0,<3.31",
    "alembic>=1.18.5,<1.19",
    "asyncpg>=0.31.0,<0.32",
    "celery>=5.6.3,<5.7",
    "fastapi>=0.139.2,<0.140",
    "httpx>=0.28.1,<0.29",
    "prometheus-client>=0.25.0,<0.26",
    "pyvips>=3.1.1,<3.2",
    "pydantic>=2.13.4,<2.14",
    "pydantic-settings>=2.14.2,<2.15",
    "redis>=8.0.1,<8.1",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10",
    "factory-boy>=3.3.3,<3.4",
    "faker>=40.36.0,<41",
    "pip-audit>=2.10.1,<2.11",
    "pyright>=1.1.411,<1.2",
    "pytest>=9.1.1,<9.2",
    "pytest-asyncio>=1.4.0,<1.5",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
afishabot = "afishabot.main:run"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # ошибки стиля
    "F",   # ошибки Pyflakes
    "I",   # сортировка импортов
    "B",   # распространённые ошибки
    "UP",  # современный Python-синтаксис
    "SIM", # упрощение кода
    "RUF", # собственные правила Ruff
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=afishabot",
    "--cov-branch",
    "--cov-fail-under=85",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
markers = [
    "integration: requires the VPS Compose integration environment",
]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
