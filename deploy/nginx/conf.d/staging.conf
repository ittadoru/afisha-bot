server {
    listen 8080;
    server_name _;

    location = /metrics {
        return 404;
    }

    location /health/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://api:8000/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://frontend:8080;
    }
}
