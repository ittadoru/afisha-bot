server {
    listen 8080;
    server_name _;

    location = /metrics {
        return 404;
    }

    location /health/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://api:8000;
    }

    location /api/ {
        client_max_body_size 13m;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://api:8000/;
    }

    # Telegram WebView may not reach OpenFreeMap directly on some mobile
    # networks. Keep all map requests on the application's own origin.
    location /map-tiles/ {
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass https://tiles.openfreemap.org/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://frontend:8080;
    }
}
