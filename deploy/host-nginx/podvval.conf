ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    listen [::]:80;
    server_name podvval.xyz admin.podvval.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name podvval.xyz;

    ssl_certificate /etc/letsencrypt/live/podvval.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podvval.xyz/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.podvval.xyz;

    ssl_certificate /etc/letsencrypt/live/podvval.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podvval.xyz/privkey.pem;

    location / {
        return 404;
    }
}
